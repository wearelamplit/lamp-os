# Publishes the firmware-flasher site (update.lamplit.ca) to GitHub Pages
# from docs/update-site/. Repo Settings -> Pages -> Source must be
# "GitHub Actions".
name: Deploy flasher site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/update-site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-flight run finish rather than cancel
# (a half-published flasher site is worse than a slightly delayed one).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The flasher serves the Latest release's firmware, so its label must
      # name that release. release.yml redeploys this site after each tag.
      - name: Stamp stable manifest version from the Latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          version=${tag#v}
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Latest release tag '$tag' is not vX.Y.Z"
            exit 1
          fi
          manifest=docs/update-site/manifest_format.json
          jq --arg v "$version" '.version = $v' "$manifest" > "$RUNNER_TEMP/manifest_format.json"
          mv "$RUNNER_TEMP/manifest_format.json" "$manifest"
          echo "manifest_format.json version: $version"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/update-site
      - id: deployment
        uses: actions/deploy-pages@v4
